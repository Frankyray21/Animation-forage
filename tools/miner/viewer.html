<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Visionneuse du mineur</title>
<style>
  :root { --bg: #15191c; --panel: #1e2428; --ink: #e4e9ec; --muted: #93a0a8; --line: #2f383f; --accent: #f2c230; color-scheme: dark; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.4 system-ui, sans-serif; }
  .app { display: grid; grid-template-columns: minmax(0, 1fr) 320px; height: 100%; }
  canvas { width: 100%; height: 100%; display: block; }
  aside { background: var(--panel); border-left: 1px solid var(--line); padding: 12px 14px; overflow: auto; display: grid; gap: 12px; align-content: start; }
  h1 { font-size: 15px; margin: 0; } h2 { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
  label { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; }
  label input[type=range] { grid-column: 1 / -1; width: 100%; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; } td { padding: 2px 0; border-bottom: 1px solid var(--line); } td:last-child { text-align: right; }
  .meshes { max-height: 260px; overflow: auto; display: grid; gap: 2px; }
  .meshes label { grid-template-columns: auto 1fr; font-family: ui-monospace, monospace; font-size: 11.5px; }
  .msg { color: var(--muted); }
  @media (max-width: 760px) { .app { grid-template-columns: 1fr; grid-template-rows: 60vh auto; } aside { border-left: 0; border-top: 1px solid var(--line); } }
</style>
</head>
<body>
<div class="app">
  <div id="view"><canvas id="c"></canvas></div>
  <aside>
    <h1>Visionneuse du mineur</h1>
    <p class="msg" id="msg">Chargement…</p>
    <section><h2>Statistiques</h2><table id="stats"></table></section>
    <section>
      <h2>Lampe frontale (SpotLight)</h2>
      <label><span>Allumée</span><input type="checkbox" id="lampOn" checked></label>
      <label><span>Intensité (cd)</span><output id="oI"></output><input type="range" id="lampI" min="0" max="6000" step="50" value="600"></label>
      <label><span>Portée (m)</span><output id="oD"></output><input type="range" id="lampD" min="2" max="30" step="1" value="12"></label>
      <label><span>Angle (°)</span><output id="oA"></output><input type="range" id="lampA" min="5" max="40" step="1" value="14"></label>
      <label><span>Inclinaison vers le bas (°)</span><output id="oP"></output><input type="range" id="lampP" min="0" max="70" step="1" value="40"></label>
      <label><span>Éclairage de la mine (sombre)</span><input type="checkbox" id="dark"></label>
    </section>
    <section><h2>Objets du modèle</h2><p class="msg">Décocher un objet pour le masquer (repérer la feuille, les ÉPI).</p><div class="meshes" id="meshes"></div></section>
  </aside>
</div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// Fichier : ?file=miner.glb (dans public/models/miner/)
const FILE = new URLSearchParams(location.search).get('file') || 'miner.glb';
const URL_MODEL = new URL(`../../public/models/miner/${FILE}`, location.href).href;
const TARGET_H = 1.80;   // m : taille visée si l'échelle source est incorrecte

const canvas = document.getElementById('c'), view = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, logarithmicDepthBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
const envTex = pmrem.fromScene(new RoomEnvironment(), .04).texture;
const camera = new THREE.PerspectiveCamera(35, 1, .05, 100);
camera.position.set(3.4, 1.9, 0.2);   // vue de 3/4 côté : personnage et faisceau au sol devant lui
const controls = new OrbitControls(camera, canvas); controls.target.set(0, .9, 1.0); controls.enableDamping = true;
const hemi = new THREE.HemisphereLight(0xeef3ff, 0x4a4038, .8); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(2, 4, 3); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -2, right: 2, top: 2.5, bottom: -.5 }); sun.shadow.normalBias = .02; scene.add(sun);
const floor = new THREE.Mesh(new THREE.CircleGeometry(4, 64), new THREE.MeshStandardMaterial({ color: 0x4b4f52, roughness: .95 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const wall = new THREE.Mesh(new THREE.PlaneGeometry(8, 4), new THREE.MeshStandardMaterial({ color: 0x5a5e60, roughness: 1 }));
wall.position.set(0, 2, -2.5); wall.receiveShadow = true; scene.add(wall);   // mur pour voir le faisceau de la lampe

// Lampe frontale : SpotLight à l'emplacement de la lampe, orientée selon le regard, suit la tête (enfant du nœud tête)
// intensité en candelas (unités physiques de three.js) : une lampe de mineur donne quelques milliers de cd au centre
const lamp = new THREE.SpotLight(0xfff2d6, 600, 12, THREE.MathUtils.degToRad(14), .5, 2);
lamp.castShadow = true; lamp.shadow.mapSize.set(1024, 1024); lamp.shadow.bias = -.0005;
const lampTarget = new THREE.Object3D(); lamp.target = lampTarget;

function setDark(on) {
  scene.background = new THREE.Color(on ? 0x07090a : 0x2a3034);
  scene.environment = on ? null : envTex;
  hemi.intensity = on ? .05 : .8; sun.intensity = on ? .0 : 1.6;
}
setDark(false);

const $ = id => document.getElementById(id);
function bindLamp() {
  lamp.visible = $('lampOn').checked;
  lamp.intensity = +$('lampI').value; lamp.distance = +$('lampD').value; lamp.angle = THREE.MathUtils.degToRad(+$('lampA').value);
  $('oI').textContent = $('lampI').value; $('oD').textContent = $('lampD').value; $('oA').textContent = $('lampA').value; $('oP').textContent = $('lampP').value;
  aimLamp();
}
// direction du regard : vers l'avant du personnage (+z glTF), inclinée vers le bas
function aimLamp() { const p = THREE.MathUtils.degToRad(+$('lampP').value); lampTarget.position.copy(lamp.position).add(new THREE.Vector3(0, -Math.sin(p), Math.cos(p))); }
['lampOn', 'lampI', 'lampD', 'lampA', 'lampP'].forEach(id => $(id).addEventListener('input', bindLamp)); bindLamp();
$('dark').addEventListener('input', e => setDark(e.target.checked));

// Repère de la lampe sur le casque : nœud nommé (CapLamp, lamp, light…) sinon tête (Head) sinon haut de la boîte
function findLampAnchor(root, box) {
  let lampNode = null, head = null;
  root.traverse(o => { const n = (o.name || '').toLowerCase(); if (!lampNode && /cap.?lamp|headlamp|lampe|lamp|torch/.test(n)) lampNode = o; if (!head && /head|tete|tête/.test(n) && !/headlamp/.test(n)) head = o; });
  return { lampNode, head };
}

new GLTFLoader().load(URL_MODEL, gltf => {
  const model = gltf.scene;
  // mesure AVANT toute mise à l'échelle
  const box0 = new THREE.Box3().setFromObject(model), size0 = box0.getSize(new THREE.Vector3());
  const scale = Math.abs(size0.y - TARGET_H) / TARGET_H > .05 ? TARGET_H / size0.y : 1;   // ne corrige que si l'écart dépasse 5 %
  model.scale.setScalar(scale);
  const box = new THREE.Box3().setFromObject(model), c = box.getCenter(new THREE.Vector3());
  model.position.set(-c.x, -box.min.y, -c.z);
  let verts = 0, tris = 0, meshes = 0; const mats = new Set(), texSizes = new Set();
  model.traverse(o => {
    if (!o.isMesh) return;
    meshes++; o.castShadow = true; o.receiveShadow = true;
    const g = o.geometry; verts += g.attributes.position.count; tris += (g.index ? g.index.count : g.attributes.position.count) / 3;
    [].concat(o.material).forEach(m => { mats.add(m); ['map', 'normalMap', 'roughnessMap', 'metalnessMap', 'aoMap', 'emissiveMap'].forEach(k => { const t = m[k]; if (t && t.image) texSizes.add(`${k} ${t.image.width}×${t.image.height}`); }); });
    const row = document.createElement('label'); const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = true;
    cb.addEventListener('input', () => { o.visible = cb.checked; }); row.append(cb, document.createTextNode(`${o.name || '(sans nom)'} · ${Math.round(tris)} tri. cumulés`)); $('meshes').append(row);
  });
  scene.add(model);
  const skinned = []; model.traverse(o => { if (o.isSkinnedMesh) skinned.push(o); });
  const bones = []; model.traverse(o => { if (o.isBone) bones.push(o); });
  const rows = [
    ['Dimensions source', `${size0.x.toFixed(3)} × ${size0.y.toFixed(3)} × ${size0.z.toFixed(3)} (unités du fichier)`],
    ['Échelle appliquée', scale === 1 ? '1 (déjà à taille humaine)' : `${scale.toFixed(4)} → ${TARGET_H} m`],
    ['Vertices', verts.toLocaleString('fr-CA')], ['Triangles', Math.round(tris).toLocaleString('fr-CA')],
    ['Meshes', meshes], ['Matériaux', mats.size],
    ['Textures', [...texSizes].join(', ') || 'aucune'],
    ['Squelette', skinned.length ? `oui (${bones.length} os)` : 'non'],
    ['Animations', gltf.animations.length ? gltf.animations.map(a => a.name).join(', ') : 'aucune'],
  ];
  $('stats').innerHTML = rows.map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join('');
  // lampe : sur le nœud « lampe » s'il existe, sinon devant le haut du casque ; orientée vers l'avant (+z glTF)
  const { lampNode, head } = findLampAnchor(model, box);
  const anchor = lampNode || head || model;
  anchor.add(lamp); anchor.add(lampTarget);
  if (!lampNode) {   // position approximative : avant du casque, ~10 cm sous le sommet (à ajuster sur le modèle réel)
    model.updateMatrixWorld(true);
    const bw = new THREE.Box3().setFromObject(model);
    lamp.position.copy(anchor.worldToLocal(new THREE.Vector3(0, bw.max.y - .1, bw.max.z - .02)));
  }
  aimLamp();
  $('msg').textContent = `Chargé : ${FILE}. Lampe accrochée à « ${anchor.name || 'modèle'} ».`;
  window.__miner = { model, lamp, gltf };
}, undefined, () => { $('msg').textContent = `Fichier introuvable : public/models/miner/${FILE}`; });

function resize() { const w = view.clientWidth, h = view.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(view); resize();
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
</body>
</html>
