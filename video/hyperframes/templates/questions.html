<!doctype html>
<!-- Généré par gen-a.mjs --synchro à partir de templates/questions.html : « Questions de l'équipe » plein cadre, calé sur l'audio.
     Une carte par question : la question (dite par le travailleur) dès qu'elle est posée, puis la réponse (0,3 s) quand le formateur
     répond ; cartes et fonds en fondu de 0,3 s. Fonds : images de l'animation 3D et rendus Blender du projet (aucune image générée),
     assombries, léger zoom. Entrée : fondu enchaîné de 0,5 s ; fermeture vers le noir : opacités mesurées sur le rejeu ffmpeg.
     DECALAGE : début de la sous-composition dans le segment (essai court commençant dans le segment : délais négatifs). -->
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Questions de l'équipe</title>
  </head>
  <body>
    <template>
      <style>
{{FONTS_CSS}}
        #root { position: absolute; left: 0; top: 0; width: {{W}}px; height: {{H}}px; overflow: hidden;
                font-family: "IBM Plex Sans", sans-serif; color: #fff; }
        .entree { position: absolute; left: 0; top: 0; width: {{W}}px; height: {{H}}px;
                  animation-name: questions-entree; animation-duration: {{ENTREE_DUREE}}s; animation-delay: {{DECALAGE}}s;
                  animation-timing-function: linear; animation-iteration-count: 1; animation-fill-mode: both; }
        {{ENTREE_CLES}}
        .fermeture { position: absolute; left: 0; top: 0; width: {{W}}px; height: {{H}}px;
                     animation-name: questions-fermeture; animation-duration: {{FERM_DUREE}}s; animation-delay: {{FERM_DEBUT}}s;
                     animation-timing-function: linear; animation-iteration-count: 1; animation-fill-mode: both; }
        {{FERM_CLES}}
        .anime { animation-duration: {{DUREE}}s; animation-delay: {{DECALAGE}}s; animation-timing-function: linear;
                 animation-iteration-count: 1; animation-fill-mode: both; }
        .fond { position: absolute; left: 0; top: 0; width: {{W}}px; height: {{H}}px; max-width: none; transform-origin: 70% 50%; opacity: 0; }
        .voile { position: absolute; inset: 0;
                 background: linear-gradient(90deg, rgba(17,21,24,.96) 0%, rgba(17,21,24,.9) 50%, rgba(17,21,24,.6) 100%); }
        .carte { position: absolute; left: 96px; right: 120px; top: 0; height: {{H}}px; display: flex; flex-direction: column;
                 justify-content: center; opacity: 0; }
        .kicker { font-size: 18px; letter-spacing: .12em; text-transform: uppercase; color: #f2c230; font-weight: 600; margin-bottom: 30px; }
        .qui { font-size: 13px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; margin-bottom: 10px; }
        .question { font-family: "Barlow Condensed", sans-serif; font-size: 58px; font-weight: 600; line-height: 1.06;
                    text-wrap: balance; max-width: 1000px; }
        .reponse { margin-top: 40px; border-left: 6px solid #57c486; padding-left: 22px; max-width: 960px;
                   animation-name: reponse-apparait; animation-duration: .3s; animation-timing-function: ease-out;
                   animation-iteration-count: 1; animation-fill-mode: both; }
        .reponse .t { font-size: 31px; font-weight: 500; line-height: 1.3; color: #eef2f4; text-wrap: pretty; }
        @keyframes reponse-apparait { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .pied { position: absolute; left: 96px; bottom: 44px; font-size: 14px; font-weight: 600; letter-spacing: .1em;
                text-transform: uppercase; color: #7d8a92; }
        {{CLES}}
      </style>
      <div id="root" data-composition-id="questions" data-width="{{W}}" data-height="{{H}}" data-no-timeline>
        <div class="entree"><div class="fermeture">
          <div style="position:absolute;inset:0;background:#111518"></div>
{{FONDS}}
          <div class="voile"></div>
{{CARTES}}
          <div class="pied">PRO-OP-DD-005 · Rencontre d'avant-quart</div>
        </div></div>
      </div>
    </template>
  </body>
</html>
