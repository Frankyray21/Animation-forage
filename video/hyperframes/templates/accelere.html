<!-- repère « Vidéo accélérée × N » (gen-a.mjs --synchro) : images mobiles sautées pour tenir l'étape dans le temps de sa voix (c'est la
     vidéo qui est accélérée, pas le geste) ; même place et même style que « Ralenti × ½ » (centré en haut, y = 18), jamais sur les
     images au ralenti, les images figées ni pendant un « Pourquoi » (même haut d'image). -->
        <div id="{{ID}}" class="clip tag pos" data-start="{{DEBUT}}" data-duration="{{DUREE}}" data-track-index="4" style="background:rgba(17,21,24,.88);color:#cfd8dc;border:1px solid #cfd8dc">{{TEXTE}}</div>
